name: stress

# The two-person call test many times on GitHub's machines (where it once
# failed), keeping the trace of any failure. Run by hand.
on:
  workflow_dispatch:
    inputs:
      times:
        description: How many times
        default: "100"
      tcp:
        description: Over ICE TCP only (the relay path)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: The program and the browser
        run: |
          ci/fetch.sh
          (cd web && npm ci && npm run build && npx playwright install --with-deps chromium)
          cargo build --examples
      - name: The call, again and again
        env:
          ORTUS_E2E_TCP_ONLY: ${{ inputs.tcp && '1' || '' }}
        run: cd web && npx playwright test e2e/call.spec.ts --repeat-each=${{ inputs.times }} --workers=2 --trace=retain-on-failure
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: call-traces
          path: web/test-results
          retention-days: 7
